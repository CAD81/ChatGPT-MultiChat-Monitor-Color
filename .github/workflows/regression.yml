name: Regression

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use a consistent Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check JavaScript syntax and manifest
        run: |
          node --check background.js
          node --check content.js
          node --check tab-status.js
          node --check popup.js
          node --check offscreen.js
          node --check tests/regression.test.mjs
          node --check tests/tab-status-color.test.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"
      - name: Run dependency-free regression harness
        run: node --test tests/*.test.mjs
      - name: Validate versioned extension release ZIP
        run: bash scripts/build-release.sh
